# Original system with the k bug fixed (k=5).
extends: ../default.yaml
name: e0_original_k5_fixed
embedding: {provider: gemini, model: gemini-embedding-001, output_dimensionality: 1536}
chunking: {strategy: recursive, chunk_size: 4000, chunk_overlap: 200, min_chunk_chars: 1,
  breadcrumb: false}
retrieval:
  mode: dense
  top_k: 5
  rerank: {enabled: false}
pipeline: {mode: single}

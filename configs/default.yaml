# Default pipeline. Experiment files in configs/experiments/ extend this and override a few keys.
# Values here are starting points; replace them with the winners from E1-E4 once measured.
name: default

corpus:
  sources_file: sources.yaml
  data_dir: data/corpus

chunking:
  strategy: markdown_header
  chunk_size: 1000
  chunk_overlap: 150
  contextual: false

embedding:
  model: BAAI/bge-base-en-v1.5
  batch_size: 64
  device: cuda

retrieval:
  mode: hybrid
  fusion: rrf
  rrf_k: 60
  candidates: 50
  top_k: 5
  rerank:
    enabled: true
    model: BAAI/bge-reranker-v2-m3
    top_n: 50
  dynamic_k:
    policy: fixed
  query_transform: none

llm:
  provider: groq
  generator: openai/gpt-oss-120b
  utility: openai/gpt-oss-20b
  judge: openai/gpt-oss-120b
  temperature: 0
  requests_per_minute: 25

pipeline:
  mode: graph
  max_rewrites: 2
  grade_documents: true
  groundedness_check: true

eval:
  golden_set: eval/golden_set.jsonl
  split: dev
  ks: [1, 3, 5, 10]
